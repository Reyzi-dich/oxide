[workspace]
resolver = "3"
members = [
  "crates/*"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Reyzi-dich"]
license = "GPL-3.0-or-later"
homepage   = "https://github.com/Reyzi-dich/oxide"
repository = "https://github.com/Reyzi-dich/oxide"

[workspace.dependencies]
chrono = "0.4.45"
glib = "0.22.10"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
mlua = { version = "0.12.1", features = ["luau", "vendored", "async", "serialize"] }
thiserror = "2.0.20"
clap = { version = "4.6.7", features = ["derive"] }

